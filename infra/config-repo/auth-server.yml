# auth-server: vigencia de tokens y umbrales de alerta (los secretos de clientes/usuarios vienen SOLO del entorno).
auth:
  alerts:
    high-severity-threshold: 5      # fallos de un mismo sujeto dentro de la ventana → alerta HIGH (posible fuerza bruta)
    window: 5m
  clients:
    web:
      access-token-ttl: 10m
      refresh-token-ttl: 8h
    mobile:
      access-token-ttl: 5m          # token de acceso corto; se renueva con refresh token rotado
      refresh-token-ttl: 30d
    atm:
      access-token-ttl: 5m
    internal:
      access-token-ttl: 5m
